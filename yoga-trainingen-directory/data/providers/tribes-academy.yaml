          retreat op 1-7 mrt zetten en 20-21 mrt de afsluiting maken. Gelezen
          als: retreat 1-7 mrt, met 10:00 en 16:00 als de gepubliceerde randen —
          de lezing die `hours_claimed.schedule` gebruikt.
