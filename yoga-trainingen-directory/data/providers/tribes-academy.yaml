programs:
  - id: 200-modern-vinyasa
    name: "200-hour Modern Vinyasa Teacher Training"
    url: https://www.tribesacademy.nl/200-hour-modern-vinyasa
    format_label: "200"
    style_claimed: >
      Modern Vinyasa: functionele & embodied anatomie, alignment-based
      asana-studie (asana's gegroepeerd in families: backbends, forward bends,
      etc. + compensatie/ modificatie), veilige & intelligente sequencing
      (action-based blueprints), moderne perspectieven op traditionele filosofie
      (historische context, geen voorgeschreven leefstijl), authentiek lesgeven
      & presence. De curriculumbrochure vult dit aan met vijf expliciete "Modern
      Vinyasa"-principes (cyclisch ritme, natuurlijke intelligentie,
      intentionele evolutie, onderlinge verbondenheid, zelfbalancerende flow) en
      een oplopende filosofielijn over de zeven hoofdstukken: vogelvlucht over
      de yogatradities → vroege wortels → Upanishads → Bhagavad Gita → Yoga
      Sutra's.
    styles: [ vinyasa ]
    accreditation:
      - body: yoga_alliance
        label_claimed: "official diploma recognized by Yoga Alliance; register as a
          Certified Yoga Teacher (RYT 200)"
        verified: yes
        source: ya-register-2026-06
        note: "Onder de RYS 200 van Tribes dance & yoga; leads Willemieke Verweij &
          Fanny Alavoine, beiden E-RYT 500."
      - body: crkbo
        label_claimed: "no VAT charged, CRKBO-registered"
        verified: yes
        source: crkbo-register-2026-06
        note: "Via Tribes dance & yoga (CRKBO-Instelling)."
    delivery:
      mode: in_person
      structure: weekends
      duration_months_min: 6
      language: en
    prerequisites_claimed: "min. 1 jaar consistente eigen praktijk (~2x/week, studio
      of thuis); ook geschikt voor bewegingsdocenten (pilates/dans/barre) die
      willen verbreden. Geen expertise vereist, wel bereidheid je comfortzone te
      verlaten."
    prerequisite:
      - kind: experience
        label: "min. 1 jaar consistente eigen praktijk (~2×/week)"
        source: site-vinyasa200-2026-06
        note: >
          "one year of consistent" praktijk — een ervaringsdrempel, geen
          certificaat en geen aankoop. Geen bedrag.
    price:
      amount_eur: 3150
      vat: exempt_crkbo
      published: yes
      includes: >
        alle trainingsweekenden, de retreat-/weekintensive en de handleidingen +
        20% korting op class cards/passes/abonnementen bij Tribes
      excludes: "2 boeken zelf aanschaffen (anatomie ~€18 + filosofie €10-20)"
      note: >
        €3150; early bird 15% korting (code Early200). €500 niet-restitueerbare
        aanbetaling, restant voor aanvang. Betaling in 3 termijnen op aanvraag
        (+5% administratiekosten). "No VAT charged, CRKBO-registered" →
        exempt_crkbo.
      source: site-vinyasa200-2026-06
    hours_claimed:
      total: 200
      contact: null
      self_study: null
      supervised_teaching_practice: null
      breakdown_published: not_published
      contact_published: not_published
      schedule:
        source: site-vinyasa200-2026-06
        note: >
          DE MEEST GENEREUZE LEZING van wat de school publiceert (decision #14)
          — een bovengrens moet ruim zijn, niet zuinig. Weekenden: harde tijden
          (vr 18:00-20:00, za 12:00-20:00, zo 10:00-18:00), waarbij het
          afsluitende blok 20-21 mrt een za+zo is zonder vrijdagavond, dus 5
          vrijdagen tegen 6 zaterdagen en 6 zondagen = ten hoogste 106 u.

          Retreatweek (1-7 mrt, 7 dagen): de school publiceert geen rooster maar
          een "Example of a retreat day" met het voorbehoud "The daily schedule
          may vary depending on the flow of the group and logistical
          considerations": 08:00 movement meditation, 09:30 flow practice, 12:30
          lunch, 14:30 theory & teaching lab, 18:00 dinner, 19:30 satsang or
          free evening. Daaruit twee lesblokken per dag — 08:00-12:30 en
          14:30-18:00 — met lunch en diner erbuiten. De randen volgen de pagina:
          de retreat "starts on Mar. 1th 2027 at 10:00" (dus 1× 10:00-12:30) en
          eindigt om 16:00 (dus 1× 14:30-16:00 op de vertrekdag). Retreat = 52
          u, totaal 158 u.

          ÉÉN DING DRUKT DEZE BOVENGRENS OMLAAG, en blaast daarmee de afgeleide
          `hours_disconnect` op: het satsang van 19:30 is niet meegeteld. Er
          staat geen eindtijd bij en het is "satsang OR free evening" — geen
          gegarandeerd programma, dus niet telbaar, ook al zou meetellen de
          grens juist ruimer (en dus veiliger) maken.

          DE 22 LESSEN BUITEN HET ROOSTER VULLEN HET GAT NIET. Ze staan per
          definitie niet op dit rooster (16 volgen, 2 assisteren, 4 observeren),
          maar dat maakt ze nog geen opleidingsuren. Tribes is RYS sinds okt
          2023 en valt dus onder de Elevated RYS 200-standaard, en die kent geen
          contacturen — alle 200 uur moeten "classroom hours" zijn: "time your
          students spend actively learning with a trainer"
          (ya-application-guide-2026-07). Daarbij sluit YA uitdrukkelijk uit:
          "public classes, regardless of the location where such activities take
          place" (ya-hours-per-day-2026-07). De 16 te vólgen lessen zijn precies
          dat — de cursist zit er als leerling in een openbare studioles — en
          tellen dus niet mee, ook al geeft een van de leads ze.

          Observeren en assisteren liggen anders: YA noemt "observing others
          teaching" en "assisting students while someone else is teaching"
          uitdrukkelijk als practicumonderdelen
          (ya-educational-categories-2026-07), en kwalificeert ze nergens met
          publiek/besloten. Die 6 lessen zijn dus verdedigbaar als
          opleidingsuren; de 16 andere niet.

          GEVOLG VOOR DE LEZING VAN HET GAT: van de 22 lessen kunnen er hooguit
          zes meetellen (ruim een kwart), dus het gat van ±42 u tussen de
          geclaimde 200 u en deze telling wordt er niet door verklaard. Lees het
          verschil als "buiten het gepubliceerde rooster" — niet als "niet
          gegeven", maar evenmin als "elders wel geleverd".

          TWEE STAPPEN HIERIN ZIJN VAN DE GIDS, NIET VAN YA. (a) Dat de
          practicum-omschrijving uit de vijf-categorieënstandaard doorwerkt in
          de Elevated RYS 200, waar practicum in Professional Essentials is
          opgegaan en alleen "apprenticeship" genoemd wordt. (b) Dat observeren
          en assisteren buiten de public-classes-uitsluiting vallen omdat de
          cursist er niet als leerling zit. Geen YA-bron zegt die twee met
          zoveel woorden; zie de notities bij de referenties.
        blocks:
          - { count: 5, start: "18:00", end: "20:00", label: "weekend, vrijdagavond" }
          - { count: 6, start: "12:00", end: "20:00", label: "weekend, zaterdag" }
          - { count: 6, start: "10:00", end: "18:00", label: "weekend, zondag" }
          - {
              count: 1,
              start: "10:00",
              end: "12:30",
              label: "retreat, aankomstdag (start 10:00)"
            }
          - { count: 6, start: "08:00", end: "12:30", label: "retreat, ochtendblok" }
          - { count: 6, start: "14:30", end: "18:00", label: "retreat, middagblok" }
          - {
              count: 1,
              start: "14:30",
              end: "16:00",
              label: "retreat, vertrekdag (eind 16:00)"
            }
      source: site-vinyasa200-2026-06
      note: >
        Format volgens de curriculumbrochure (brochure-curriculum-2026-07): "5
        weekends + 1 retreat week + 1 closing weekend" — vr 18:00-20:00, za
        12:00-20:00, zo 10:00-18:00. Het afsluitende blok (20-21 mrt 2027) is
        een za+zo zonder vrijdagavond, dus over de hele run: 5 vrijdagavonden, 6
        zaterdagen, 6 zondagen.

        HANDS-ON — de twee bronnen tellen anders. De site
        (site-vinyasa200-2026-06): "you'll attend 16 classes, assist in 2, and
        observe 4 with the trainers" = 22 lessen. De brochure
        (brochure-curriculum-2026-07) zet onder "Between weekends" alleen "16
        classes to attend with the trainers from the day you sign up" en "4 real
        classes to observe through the training" = 20 lessen; het assisteren
        komt er niet in voor. Beide zijn gearchiveerd. Deze lessen zitten in
        geen van beide lezingen in de ceiling — ze staan per definitie buiten
        het rooster — en de `schedule`-note houdt de 22 van de site aan: het
        hogere aantal, en dus de lezing die het meest in het voordeel van de
        school uitvalt.

        NIET ALLE 22 KUNNEN OPLEIDINGSUREN ZIJN. Onder de Elevated RYS
        200-standaard waar Tribes onder valt moeten alle 200 uur "classroom
        hours" zijn en sluit YA "public classes" uitdrukkelijk uit, ongeacht
        locatie. De 16 te vólgen lessen zijn openbare studiolessen waarin de
        cursist als leerling zit: die tellen niet mee, ook niet omdat een lead
        ze geeft. Het assisteren (2) en observeren (4) zijn wél als
        practicumonderdelen benoemd en zijn dus verdedigbaar. Zie de
        `schedule`-note voor wat dat met het gat doet, en de referenties
        ya-application-guide-2026-07, ya-hours-per-day-2026-07 en
        ya-educational-categories-2026-07 voor de bronnen.

        Eindtoets: open-book essay (thuis) + groeps-lesexamen, lesgeven in een
        groepje van 3 à 4. Geen geïsoleerd contact-/lespraktijk-urental
        gepubliceerd.

        De roostertelling staat in `schedule`.
    group_size_claimed:
      max: 14
      source: brochure-curriculum-2026-07
      note: >
        "Maximum 14 trainees" (Practical details) en "Up to fourteen people"
        (The community). Staat NIET op de publieke 200u-pagina: de gearchiveerde
        site-capture van 2026-06-28 noemt nergens een maximum of minimum. Alleen
        de brochure geeft dit — een van de weinige feiten hier die buiten het
        gated document niet te vinden is. Geen minimum gepubliceerd.
