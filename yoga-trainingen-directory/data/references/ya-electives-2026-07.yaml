  DE REGEL. "Yoga Alliance honors and respects all disciplines and traditions
  related to yoga, but all required hours for each designation (i.e., 200 hours
  of the RYS 200) must be directly related to the Educational Categories and
  cannot contain information that does not directly relate to yoga." Dit is de
  Help Center-uitwerking van #5 Subjects of Study uit ya-standards-2026-07, en
  het is het enige stuk waar YA het abstracte "directly related" invult met
  concrete onderwerpen.

  WEL AANVAARD, "topics that can count towards RYS required hours" — Techniques,
  Training, and Practice: Acro Yoga, Aerial Yoga, Sacred Sound, Stand Up
  Paddleboard. Yoga Humanities: Ayurveda, Jyotish, Yantra.

  NIET AANVAARD: Acupressure, Acupuncture, Chinese Medicine, Craniosacral
  Therapy, Creative Arts & Crafts, Crystals, Essential Oils, Herbalism,
  Nutrition, Organic Farming, QiGong, Reiki, Shamanism, Substance Related Yoga*,
  Tai Chi, Tapping Therapy, Thai Massage, Western Astrology. (* verwijst naar de
  Code of Conduct.) De pagina verwijst verder naar de Scope of Practice.

  LET OP DE REIKWIJDTE: dit gaat over ONDERWERPEN (waar de uren inhoudelijk over
  mogen gaan), niet over ACTIVITEITSVORMEN (of het volgen, observeren of
  assisteren van lessen als classroom hour telt). Die vraag beantwoordt deze
  pagina niet; zie ya-application-guide-2026-07 voor de positieve definitie en
  ya-hours-per-day-2026-07 voor de uitsluitingslijst.
