note: >
  "Registered Yoga School Application Guide" (PDF, 2204 regels tekst; zelfde
  upload-pad /2025/05/ als ya-standards-2026-07). HIER STAAT DE POSITIEVE
  DEFINITIE VAN EEN CLASSROOM HOUR — de enige die ik in de YA-bronnen heb
  gevonden. Het standaardendocument geeft alleen urenverdelingen en
  ya-hours-per-day-2026-07 grenst alleen af wat het NIET is:

  "CLASSROOM HOURS: A classroom hour is defined as time your students spend
  actively learning with a trainer (wether virtually, or in-person). Classroom
  hours do not include time your trainees spend on homework or independent
  study." (het "wether" staat zo in het origineel)

  TWEE CRITERIA DUS: (1) actief leren, (2) mét een trainer erbij — fysiek of
  online. Zelfstudie en huiswerk vallen er expliciet buiten, wat de
  uitsluitingslijst van ya-hours-per-day-2026-07 bevestigt.

  SPANNING MET DIE UITSLUITINGSLIJST, en die is hier van belang. Een openbare
  studioles die door de eigen trainer gegeven wordt, voldoet naar de letter aan
  deze positieve definitie (leerling leert actief, trainer aanwezig), maar
  ya-hours-per-day-2026-07 noemt "public classes, regardless of the location
  where such activities take place" uitdrukkelijk als NIET-meetellend. De
  specifieke uitsluiting gaat dan voor de algemene definitie. Over observeren
  en assisteren zwijgen beide documenten: die staan op geen van beide lijsten.

  VERDER RELEVANT: de Glossary eist bij de aanvraag een "Training Schedule" die
  moet bevatten: "Dates and times you meet / Number of modules and if
  successive or intermittent / Educational Categories and other curriculum for
  each day and time / Schedule and length of breaks for each day." Een RYS
  heeft dus een dagrooster mét pauzes bij YA liggen, ook wanneer de school er
  publiek geen publiceert.

  NIET VERWARREN: verderop in het document staat "a deduction of ___ hour from
  their total contact hours". Dat is een INVULSJABLOON voor het
  aanwezigheidsbeleid dat scholen zelf moeten indienen, geen YA-norm — de
  onderstrepingen zijn invulvelden. Het document zegt niets over observeren,
  assisteren of practicum.
